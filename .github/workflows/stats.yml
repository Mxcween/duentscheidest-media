name: Instagram-Statistik
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: stats
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Statistik holen
        env:
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
        run: python3 scripts/fetch_stats.py
      - name: Speichern
        run: |
          git config user.name "studio-bot"
          git config user.email "studio-bot@users.noreply.github.com"
          git add studio/data
          git diff --cached --quiet || (git commit -qm "Statistik $(date -u +%H:%M)" && git push)
